spring.application.name=marketplace-backend
server.port=8080

# --- H2 file-based database (persists after restart, zero external setup) ---
spring.datasource.url=jdbc:h2:file:./data/marketplace
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 Console ---
# Open: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
app.jwt.secret=change-this-secret-to-a-long-random-string-at-least-32-bytes-please
app.jwt.expiration-ms=86400000

# --- Seed demo data on first run ---
app.seed.enabled=true